name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [trim-mod]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "17", cache: gradle }
      - name: Flutter version
        id: fv
        run: echo "v=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fv.outputs.v }}
          cache: true
      - run: flutter pub get
      - name: Create throwaway signing key
        run: |
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore android/app/keystore.jks -alias trimmod -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=Fladder Trim Mod"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=trimmod\n' "$PW" "$PW" > android/app/key.properties
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --flavor production
      - uses: actions/upload-artifact@v4
        with:
          name: fladder-trim-apk
          path: build/app/outputs/flutter-apk/*-production-release.apk
